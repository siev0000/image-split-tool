<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>GIF・エフェクト画像作成ツール</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7206446342174250"
     crossorigin="anonymous"></script>
  <link rel="stylesheet" href="style_final.css">
  <script src="gif.js"></script>
</head>
<body>
  <h2>GIF・エフェクト画像作成ツール</h2>
  <!-- 入力と設定エリア -->
  <div class="input-panel">
    <label>画像を選択: <input type="file" id="imageInput" accept="image/*"></label>
    <div id="basePreview"></div>

    <label>分割数（横 × 縦）:
      <input type="number" id="splitX" value="5" min="1"> ×
      <input type="number" id="splitY" value="3" min="1">
    </label>

    <label>並び方向:
      <select id="direction">
        <option value="horizontal">横</option>
        <option value="vertical">縦</option>
      </select>
    </label>

    <label>出力サイズ（幅 × 高さ）:
      <input type="number" id="resizeWidth" placeholder="例: 120" min="1"> ×
      <input type="number" id="resizeHeight" placeholder="例: 120" min="1">
    </label>

    <label>回転角度（0〜360°）:
      <input type="number" id="rotation" value="0" min="0" max="360">
    </label>

    <div class="effect-panel" id="effectPanel">
      <button type="button" class="effect-header" id="effectToggleBtn" onclick="toggleEffectPanel()">
        エフェクト設定 ▼
      </button>
      <div class="effect-body" id="effectBody">
      <label>プリセット:
        <select id="effectPreset">
          <option value="none">なし</option>
          <option value="grayscale">グレースケール</option>
          <option value="sepia">セピア</option>
          <option value="invert">ネガ反転</option>
          <option value="vivid">ビビッド</option>
          <option value="dreamy">ドリーミー</option>
        </select>
      </label>

      <label>明るさ（%）:
        <input type="number" id="effectBrightness" value="100" min="0" max="300">
      </label>

      <label>コントラスト（%）:
        <input type="number" id="effectContrast" value="100" min="0" max="300">
      </label>

      <label>彩度（%）:
        <input type="number" id="effectSaturate" value="100" min="0" max="300">
      </label>

      <label>色相回転（deg）:
        <input type="range" id="effectHueRange" value="0" min="-180" max="180" step="1">
        <input type="number" id="effectHue" value="0" min="-180" max="180">
      </label>

      <label>ぼかし（px）:
        <input type="number" id="effectBlur" value="0" min="0" max="20" step="0.5">
      </label>

      <label>カラー選択:
        <input type="color" id="effectTintColor" value="#ff6600">
      </label>

      <label>カラー強度（%）:
        <input type="number" id="effectTintStrength" value="0" min="0" max="100">
      </label>
      </div>
    </div>

    <button onclick="splitAndApply()">分割</button>
  </div>

  <!-- タブ切替 -->
  <div class="tab-container">
    <div class="tabs">
      <button class="tab-button active" onclick="switchTab('editor')">編集画面</button>
      <button class="tab-button" onclick="switchTab('output')">出力画面</button>
    </div>

    <div class="tab-content active" id="editorTab">
      <div id="editorArea" class="frame-list sortable"></div>
    </div>

    <div class="tab-content" id="outputTab">
      <div class="output-buttons">
        <div class="row">
          <button id="applyAndGifBtn" onclick="renderOutputAndGIF()">変更を反映</button>
          <button onclick="download()">ダウンロード</button>
        </div>
        <div class="row gif-controls">
          <label>フレーム間隔（ms）:
            <input type="number" id="gifDelay" value="60" min="10">
          </label>
          <label>色相アニメーション（deg/フレーム）:
            <input type="number" id="gifHueStep" value="0" min="-180" max="180">
          </label>
          <button id="downloadGifBtn" onclick="downloadGIF()" disabled>GIFダウンロード</button>
        </div>
      </div>

      <div class="gif-preview-panel">
        <h3>GIFプレビュー</h3>
        <div id="gifStatus">GIF未生成</div>
        <img id="gifPreview" alt="GIFプレビュー" />
      </div>

      <canvas id="outputCanvas"></canvas>
    </div>
  </div>

  <!-- スクリプト読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="script.js"></script>



</body>
</html>
